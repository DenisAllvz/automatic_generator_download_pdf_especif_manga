[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-manager"
version = "2.5.0"
description = "Biblioteca desktop de capítulos autorizados"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "aiohttp>=3.12,<4", "beautifulsoup4>=4.13,<5", "Pillow>=11,<13", "pikepdf>=10,<11"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pyinstaller>=6.16,<7"]
browser = ["playwright>=1.48,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
